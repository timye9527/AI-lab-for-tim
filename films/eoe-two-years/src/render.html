<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>render</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
  // 给离线渲染脚本用：逐帧调用 grab(t)；?subs=0 输出无字幕版
  import { createFilm } from './film.js';
  const canvas = document.getElementById('c');
  const subtitles = new URLSearchParams(location.search).get('subs') !== '0';
  const film = await createFilm(canvas, { subtitles });
  window.renderAt = (t) => film.render(t);
  window.grab = async (t, type = 'image/png', q) => {
    film.render(t);
    const blob = await new Promise((r) => canvas.toBlob(r, type, q));
    const buf = new Uint8Array(await blob.arrayBuffer());
    let s = '';
    for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return btoa(s);
  };
  window.ready = true;
</script>
</body>
</html>
