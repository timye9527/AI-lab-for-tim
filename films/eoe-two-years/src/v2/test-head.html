<!doctype html><meta charset="utf-8"><canvas id="c" width="1600" height="700"></canvas>
<script type="module">
import { drawHeadFront, drawHeadQuarter, expr } from './tim2.js';
const ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle = '#FAF3D7'; ctx.fillRect(0, 0, 1600, 700);
const list = [
  [drawHeadFront, expr({ mouth: 'grin' })],
  [drawHeadFront, expr({ mouth: 'flat', brows: 'worry', look: [-0.8, 0], sweat: 1 })],
  [drawHeadFront, expr({ eyes: 'shock', mouth: 'scream', brows: 'up' })],
  [drawHeadQuarter, expr({ mouth: 'grin', eyes: 'happy', blush: 1 })],
  [drawHeadQuarter, expr({ mouth: 'awk', brows: 'worry', blush: 1, sweat: 1 })],
];
list.forEach(([f, e], i) => { ctx.save(); ctx.translate(170 + i * 315, 360); ctx.scale(1.3, 1.3); f(ctx, e); ctx.restore(); });
window.ready = true;
</script>
