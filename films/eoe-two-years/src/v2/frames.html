<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
  // 风格关键帧：?f=door|alarm|warm|lineup
  import { FRAMES } from './frames.js';
  const f = new URLSearchParams(location.search).get('f') || 'door';
  const c = document.getElementById('c');
  [c.width, c.height] = f === 'lineup' ? [1920, 1080] : [1080, 1920];
  await Promise.all([document.fonts.load('900 76px "Noto Sans SC"', 'EOE中文演讲俱乐部非法闯入？！'), document.fonts.load('700 54px "Noto Sans SC"', '两年前第一次来到这里已经有了他舍不得的人自由开放趣味奇葩第三年继续一起玩角色设定伙伴们同一套画法换发型和衣服开头紧张后来松弛'), document.fonts.load('500 26px "Noto Sans SC"', 'eloquence of the elites按本人照片设计俱乐部插画风粗描边平涂一层暗部')]);
  FRAMES[f](c.getContext('2d'));
  window.ready = true;
</script></body></html>
