<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>新云 · 画面引擎</title>
<link rel="stylesheet" href="../out/node_modules/@fontsource/noto-sans-sc/400.css">
<link rel="stylesheet" href="../out/node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="../out/node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="../out/node_modules/@fontsource/jetbrains-mono/500.css">
<link rel="stylesheet" href="../out/node_modules/@fontsource/jetbrains-mono/800.css">
<style>
  :root {
    --bg: #0B0D10; --panel: #14171C; --line: #262B33; --text: #EDEEF0; --muted: #9BA1A6;
    --up: #E5484D; --down: #30A46C; --blue: #3E63DD; --amber: #FFB224;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Noto Sans SC', sans-serif; color: var(--text); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.035), transparent 60%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 80px 80px,
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 80px 80px,
      var(--bg); }
  .abs { position: absolute; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .card { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 34px; }
  .tag { font-size: 24px; color: var(--muted); letter-spacing: .02em; }
  .src { position: absolute; right: 18px; bottom: 12px; font-size: 17px; color: #6E757C; font-family: 'JetBrains Mono', monospace; }
  .big { font-weight: 900; line-height: 1.05; }
  .up { color: var(--up); } .down { color: var(--down); } .blue { color: var(--blue); } .amber { color: var(--amber); } .muted { color: var(--muted); }
  .quote { font-size: 44px; font-weight: 700; line-height: 1.45; }
  .who { font-size: 26px; color: var(--muted); margin-bottom: 18px; }
  .cred { display: flex; gap: 22px; margin-top: 22px; font-size: 20px; color: var(--muted); }
  .cred b { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-left: 4px; background: #3A3F47; vertical-align: -1px; }
  .cred b.on { background: var(--text); } .cred b.warn { background: var(--amber); } .cred b.bad { background: var(--up); }
  #chrome-top { position: absolute; left: 120px; right: 120px; top: 40px; height: 40px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; color: var(--muted); }
  #chrome-top .brand b { color: var(--amber); font-weight: 700; margin-right: 12px; }
  #chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 18px; color: var(--text); }
  #disclaimer { position: absolute; left: 34px; top: 140px; writing-mode: vertical-rl; font-size: 17px; color: rgba(155,161,166,.6); letter-spacing: .12em; }
  #sub { position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%); max-width: 1600px; padding: 10px 28px; border-radius: 10px;
    background: rgba(0,0,0,.55); font-size: 46px; font-weight: 700; text-align: center; white-space: nowrap; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #sub:empty { display: none; }
  .bar { position: absolute; border-radius: 6px; }
  .pill { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 6px 18px; font-size: 24px; }
  table.t4 { position: absolute; border-collapse: collapse; font-size: 28px; }
  table.t4 td { border-bottom: 1px solid var(--line); padding: 18px 20px; vertical-align: top; }
  table.t4 td:first-child { color: var(--muted); width: 170px; font-size: 24px; padding-top: 22px; }
</style>
</head>
<body>
<div id="stage">
  <div id="chrome-top"><div class="brand"><b>看懂AI主线</b>新云，是 AI 的卖铲人，还是背债人？</div><div id="chip"></div></div>
  <div id="disclaimer">本视频仅为行业信息整理，不构成投资建议 · 过往表现不代表未来</div>
  <div id="scenes"></div>
  <div id="sub"></div>
</div>
<script>
// ---------- 基础工具 ----------
const $s = document.getElementById('scenes');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
let TL = null, SC = [], cues = [];

function el(parent, html, css = {}, cls = 'abs') {
  const d = document.createElement('div');
  d.className = cls; d.innerHTML = html; Object.assign(d.style, css); parent.appendChild(d); return d;
}
// 按口播关键词找时间点（改稿后依然对得上）
function cue(sec, needle, k = 0) {
  const ls = TL.lines.filter(l => l.sec === sec && l.text.includes(needle));
  if (!ls.length) throw new Error(`找不到口播：第 ${sec} 段「${needle}」`);
  return ls[Math.min(k, ls.length - 1)].start;
}
function secStart(sec) { return TL.lines.find(l => l.sec === sec).start; }
function secEnd(sec) { const n = TL.lines.find(l => l.sec === sec + 1); return n ? n.start : TL.duration; }
// 动画：淡入上浮 / 淡出
function show(e, t, t0, t1 = Infinity, d = 0.45, dy = 24) {
  const p = ease((t - t0) / d), q = t1 === Infinity ? 1 : 1 - ease((t - t1) / 0.35);
  const o = Math.min(p, q);
  e.style.opacity = o; e.style.transform = (e.dataset.base || '') + ` translateY(${(1 - p) * dy}px)`;
}
function count(e, t, t0, to, fmt, d = 0.9) { e.textContent = fmt(to * ease((t - t0) / d)); }
function grow(e, t, t0, prop, to, d = 0.8) { e.style[prop] = (to * ease((t - t0) / d)) + 'px'; }
function svg(parent, w, h, inner, css) { return el(parent, `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`, css); }
function draw(path, t, t0, d = 0.6) { const L = path.getTotalLength(); path.style.strokeDasharray = L; path.style.strokeDashoffset = L * (1 - ease((t - t0) / d)); }
function card(parent, html, css) { return el(parent, html, css, 'card'); }
function quoteCard(parent, who, text, cred, src, css) {
  const c = ['信息位置', '真金白银', '利益相关'].map((n, i) => `<span>${n}${cred[i]}</span>`).join('');
  return card(parent, `<div class="who">${who}</div><div class="quote">${text}</div><div class="cred">${c}</div><div class="src">${src}</div>`, css);
}
const dots = (n, cls = 'on') => Array.from({ length: 3 }, (_, i) => `<b class="${i < n ? cls : ''}"></b>`).join('');

// ---------- 场景定义：每段口播一个场景 ----------
const BUILD = [];
const IDENT = (R, s) => {
  R.style.background = 'radial-gradient(ellipse at 50% 45%, #15202B 0%, #0B0D10 70%)';
  const dies = Array.from({ length: 13 }, (_, r) => Array.from({ length: 13 }, (_, c) => {
    const x = (c - 6) * 34, y = (r - 6) * 34; return Math.hypot(x + 17, y + 17) < 210 ? `<rect x="${x + 230}" y="${y + 230}" width="30" height="30" rx="3" fill="#2A3442"/>` : '';
  }).join('')).join('');
  const wafer = svg(R, 460, 460, `<circle cx="230" cy="230" r="222" fill="#1B2430" stroke="#5B6B80" stroke-width="3"/>${dies}<circle cx="230" cy="230" r="222" fill="url(#sh)"/><defs><linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`, { left: '730px', top: '250px' });
  const stage3d = el(R, '', { left: '760px', top: '260px', width: '400px', height: '420px', perspective: '900px' });
  const layers = Array.from({ length: 12 }, (_, i) => el(stage3d, '', { left: '60px', top: `${330 - i * 22}px`, width: '280px', height: '18px', borderRadius: '4px',
    background: i === 0 ? 'linear-gradient(90deg,#8C6A1C,#FFB224)' : 'linear-gradient(90deg,#3E4D61,#8FA3BC)', boxShadow: '0 2px 0 rgba(0,0,0,.5)', transformOrigin: '50% 100%' }));
  const name = el(R, '看懂AI主线', { left: '0', right: '0', top: '700px', textAlign: 'center', fontSize: '110px', fontWeight: 900, letterSpacing: '.06em' });
  const slogan = el(R, '<span class="amber">AI 产业链</span>　·　每周洞见', { left: '0', right: '0', top: '850px', textAlign: 'center', fontSize: '40px', fontWeight: 700, color: 'var(--muted)' });
  const bar = el(R, '', { left: '760px', top: '835px', width: '400px', height: '6px', background: 'var(--amber)', transformOrigin: '50% 50%' });
  return t => {
    const k = t - s;
    const w1 = clamp(k / 0.9);
    wafer.style.opacity = Math.min(w1, 1 - clamp((k - 1.6) / 0.4));
    wafer.style.transform = `scale(${0.6 + 0.4 * ease(w1)}) rotate(${k * 70}deg)`;
    layers.forEach((L, i) => {
      const p = ease((k - 1.6 - i * 0.12) / 0.35);
      L.style.opacity = clamp((k - 1.6 - i * 0.12) / 0.1);
      L.style.transform = `rotateX(${(1 - p) * 88}deg) translateY(${(1 - p) * -30}px)`;
    });
    stage3d.style.transform = `translateY(${-60 * ease((k - 3.4) / 0.6)}px) scale(${1 - 0.15 * ease((k - 3.4) / 0.6)})`;
    name.style.opacity = clamp((k - 3.3) / 0.25); name.style.transform = `scale(${1.25 - 0.25 * ease((k - 3.3) / 0.35)})`;
    bar.style.transform = `scaleX(${ease((k - 3.5) / 0.4)})`; slogan.style.opacity = clamp((k - 3.7) / 0.3);
  };
};

// ================= 新云一期：每段一个场景 =================
const head = (R, s, txt) => { const h = el(R, txt, { left: '120px', top: '120px', fontSize: '46px', fontWeight: 900 }); return t => show(h, t, s); };
const lineEnd = (sec, needle) => { const l = TL.lines.find(x => x.sec === sec && x.text.includes(needle)); return l.end; };

// 0 冷开场：−37% → 订单 1040 亿 → 剪刀差 → 马斯克 → 三个问题
const COLD = (R, s) => {
  const c = n => cue(0, n);
  const top = el(R, '<div class="tag">十月 · AI 圈跌得最狠的</div><div class="big mono down" style="font-size:230px">−37%</div><div style="font-size:56px;font-weight:900;margin-top:4px">CoreWeave · 一个月</div>', { left: '120px', top: '150px' });
  const nv = el(R, '<span class="muted" style="text-decoration:line-through;text-decoration-thickness:4px">英伟达</span>', { left: '1300px', top: '260px', fontSize: '80px', fontWeight: 900 });
  const bk = el(R, '<div class="tag">可它手里的订单（6 月底）</div><div class="big mono amber" style="font-size:150px">$0亿</div>', { left: '1060px', top: '560px' });
  const sc = svg(R, 1680, 520, `
    <line x1="0" y1="500" x2="1680" y2="500" stroke="#3A3F47" stroke-width="2"/>
    <path id="o0" d="M0 430 C400 400 800 300 1200 180 S1600 60 1680 40" fill="none" stroke="#FFB224" stroke-width="8"/>
    <path id="p0" d="M0 120 C300 110 600 160 900 250 S1400 420 1680 470" fill="none" stroke="#30A46C" stroke-width="8"/>
    <text x="1500" y="30" fill="#FFB224" font-size="34" font-weight="700">订单</text><text x="1500" y="440" fill="#30A46C" font-size="34" font-weight="700">股价</text>
    <text x="0" y="520" fill="#6E757C" font-size="18">示意</text>`, { left: '120px', top: '230px' });
  const scT = el(R, '订单越多，<span class="down">股价越跌</span>', { left: '120px', top: '140px', fontSize: '72px', fontWeight: 900 });
  const mk = el(R, '<div class="tag">马斯克 · X 平台 · 10/25（大意）</div><div style="font-size:70px;font-weight:900;line-height:1.3;margin-top:12px"><span class="amber mono">200+</span> 家新云<br>会像孔雀鱼一样，<span class="up">成批死掉</span></div>', { left: '120px', top: '260px', width: '1680px' });
  const fish = svg(R, 600, 300, Array.from({ length: 14 }, (_, i) => {
    const x = 40 + (i % 7) * 80, y = 60 + Math.floor(i / 7) * 120; return `<g class="f" transform="translate(${x} ${y})"><ellipse cx="0" cy="0" rx="26" ry="13" fill="#9BA1A6"/><path d="M24 0 L46 -14 L46 14 Z" fill="#9BA1A6"/></g>`;
  }).join(''), { left: '1240px', top: '560px' });
  const qh = el(R, '这期只回答三个问题', { left: '150px', top: '190px', fontSize: '44px', fontWeight: 700, color: 'var(--muted)' });
  const qs = ['订单这么多，<br>它为什么缺钱？', '马斯克说的大倒闭，<br>会成真吗？', '这笔账，<br>最后落在谁头上？'].map((q, i) =>
    card(R, `<div class="mono amber" style="font-size:40px;font-weight:800">0${i + 1}</div><div style="font-size:50px;font-weight:900;line-height:1.3;margin-top:14px">${q}</div>`, { left: `${150 + i * 560}px`, top: '300px', width: '520px', height: '400px' }));
  const t1 = c('是一家'), t2 = c('一个月'), t3 = c('可它手里'), t4 = c('订单越多'), t5 = c('马斯克又补'), t6 = c('这期只回答');
  const tq = [c('为什么缺钱'), c('大倒闭'), c('这笔账')];
  return t => {
    top.style.opacity = t < t4 - 0.2 ? 1 : 1 - clamp((t - t4 + 0.2) / 0.3);
    top.children[1].style.transform = `scale(${1.12 - 0.12 * ease((t - s + 0.6) / 0.4)})`; top.children[1].style.transformOrigin = '0 50%';
    top.children[2].style.opacity = clamp((t - t1) / 0.3);
    show(nv, t, s + 0.2, t1 + 0.3);
    show(bk, t, t3, t4 - 0.2); count(bk.lastChild, t, t3, 1040, x => `$${Math.round(x)}亿`, 1.0);
    show(scT, t, t4, t5 - 0.2); show(sc, t, t4, t5 - 0.2, 0.3, 0); draw(sc.querySelector('#o0'), t, t4, 1.2); draw(sc.querySelector('#p0'), t, t4 + 0.2, 1.2);
    show(mk, t, t5, t6 - 0.2); show(fish, t, c('孔雀鱼'), t6 - 0.2, 0.3, 0);
    fish.querySelectorAll('.f').forEach((f, i) => { const k = clamp((t - c('成批') - i * 0.07) / 0.3); f.style.opacity = 1 - 0.75 * k; f.style.transform = `translateY(${k * 40}px) rotate(${k * 180}deg)`; f.style.transformBox = 'fill-box'; f.style.transformOrigin = 'center'; });
    show(qh, t, t6);
    qs.forEach((q, i) => show(q, t, tq[i], Infinity, 0.35, 40));
  };
};

// 2 四刀快剪：10 月时间轴
const KNIVES = (R, s) => {
  const c = n => cue(2, n);
  const X = d => ({ 1: 160, 8: 560, 13: 900, 14: 1180, 22: 1500, 26: 1760 })[d];
  el(R, '先用一分钟，过一遍这个月', { left: '120px', top: '110px', fontSize: '34px', fontWeight: 700, color: 'var(--muted)' });
  svg(R, 1920, 90, `<line x1="160" y1="60" x2="1760" y2="60" stroke="#3A3F47" stroke-width="3"/>` + [1, 8, 13, 14, 22, 26].map(d => `<text x="${X(d)}" y="40" fill="#9BA1A6" font-size="24" font-family="JetBrains Mono" text-anchor="middle">10/${d}</text>`).join(''), { left: '0', top: '160px' });
  const K = [[8, '第一刀', '<div class="tag">据 FT · OpenAI 9 月底年化收入（美元）</div><div style="margin-top:10px"><span style="font-size:44px;font-weight:700">市场传 </span><span class="mono muted" style="font-size:80px;font-weight:800">~$680亿</span><span style="font-size:44px;font-weight:700;margin-left:40px">实际 </span><span class="mono" style="font-size:80px;font-weight:800">~$500亿</span></div><div style="font-size:52px;font-weight:900;margin-top:22px">CoreWeave 当天 <span class="mono down">−8%</span></div>', 'CNBC · 10/8'],
             [13, '第二刀', '<div class="tag">查马斯 · 硅谷投资人 · X 平台</div><div style="font-size:52px;font-weight:900;margin-top:10px">CoreWeave 债券收益率</div><div class="mono amber" style="font-size:150px;font-weight:800">15%</div><div style="font-size:52px;font-weight:900">马斯克回复：<span class="amber">「Yikes」</span><span class="muted" style="font-size:34px">（好家伙）</span></div>', '彭博 · 10/13'],
             [14, '第三刀', '<div class="tag">美国通胀超预期 · 加息押注升温 · 10/14 单日</div><div style="display:flex;gap:60px;margin-top:18px">' + [['CoreWeave', '−15.5%', 1], ['戴尔', '−11%', 0], ['Nebius', '−10%', 0], ['甲骨文', '−9%', 0]].map(([n, v, b]) => `<div><div class="tag">${n}</div><div class="mono down" style="font-size:${b ? 110 : 76}px;font-weight:800">${v}</div></div>`).join('') + '</div><div style="font-size:52px;font-weight:900;margin-top:18px">四家一天蒸发 <span class="mono amber">~$800亿</span></div>', 'CNBC / 路透 · 10/14'],
             [22, '第四刀', '<div class="tag">10/22 · Meta 财报后 AI 开支疑虑</div><div style="margin-top:10px"><span style="font-size:44px;font-weight:700">纳指 </span><span class="mono down" style="font-size:120px;font-weight:800">−2.6%</span><span class="muted" style="font-size:36px;margin-left:20px">6 月以来最大单日跌幅</span></div><div style="font-size:52px;font-weight:900;margin-top:16px">CoreWeave <span class="mono down">−10%</span> · 一年新低 <span class="mono">$55.6</span></div>', '路透 · 10/22']];
  const ks = K.map(([d, n, html, src]) => {
    const g = svg(R, 80, 90, `<path d="M15 8 L65 82" stroke="#FFB224" stroke-width="10" stroke-linecap="round"/>`, { left: `${X(d) - 40}px`, top: '226px' });
    const lab = el(R, `<span class="mono" style="font-weight:800">${n}</span>`, { left: `${X(d) - 60}px`, top: '318px', width: '120px', textAlign: 'center', fontSize: '24px', color: 'var(--amber)' });
    const cd = el(R, `<div class="mono amber" style="font-size:30px;font-weight:800">${n} · 10/${d}</div><div style="margin-top:14px">${html}</div><div class="muted" style="font-size:18px;margin-top:18px;font-family:'JetBrains Mono'">${src}</div>`, { left: '160px', top: '380px', width: '1600px' });
    return { g, lab, cd, t0: c(n) };
  });
  const fair = el(R, '<div class="tag">公平地说</div><div style="font-size:56px;font-weight:900;margin-top:10px">大盘不是它一家拖下去的</div><div style="display:flex;gap:20px;margin-top:22px"><span class="pill">通胀超预期</span><span class="pill">巨头 AI 开支</span><span class="pill">油价</span></div>', { left: '160px', top: '380px' });
  const first = el(R, '但它是<span class="amber">第一个被债市点名的</span>', { left: '160px', top: '630px', fontSize: '60px', fontWeight: 900 });
  const cds = card(R, '<div class="tag">给它的债买违约保险 · 五年期 CDS · 10/15 峰值</div><div style="margin-top:8px"><span style="font-size:40px;font-weight:700">一年保费 ≈ 本金的 </span><span class="mono amber" style="font-size:130px;font-weight:800">12%</span></div><div class="src">彭博 · 约 1194 基点</div>', { left: '160px', top: '390px', width: '1600px' });
  const tF = c('公平地说'), tB = c('第一个被债市'), tC = c('违约保险');
  return t => {
    ks.forEach((k, i) => {
      const next = i + 1 < ks.length ? ks[i + 1].t0 : tF;
      show(k.g, t, k.t0, Infinity, 0.12, 0); draw(k.g.querySelector('path'), t, k.t0, 0.2); show(k.lab, t, k.t0 + 0.1);
      show(k.cd, t, k.t0 + 0.1, next - 0.25, 0.3, 30);
    });
    show(fair, t, tF, tC - 0.25); show(first, t, tB, tC - 0.25);
    show(cds, t, tC, Infinity, 0.35, 30);
  };
};

// 3 争议一：订单一千亿，为什么还缺钱
const MODEL = (R, s, I) => {
  const c = n => cue(I, n);
  const H = head(R, s, '<span class="amber mono">争议一</span>　订单一千亿，为什么还缺钱？');
  // 商业模式流程
  const steps = [['借钱', '债券 · 贷款', 'var(--up)'], ['买显卡 · 建机房', '英伟达 GPU', 'var(--text)'], ['按小时出租', '微软 · OpenAI', 'var(--text)'], ['收租', '分好几年', 'var(--amber)']];
  const flow = steps.map(([a, b, col], i) => card(R, `<div style="font-size:40px;font-weight:900;color:${col}">${a}</div><div class="muted" style="font-size:26px;margin-top:8px">${b}</div>`, { left: `${120 + i * 430}px`, top: '260px', width: '370px', height: '170px' }));

    <path id="rent" d="M40 80 C240 90 380 120 520 200 S820 360 1080 390" fill="none" stroke="#FFB224" stroke-width="7"/>
    <path id="int" d="M40 300 L1080 300" fill="none" stroke="#E5484D" stroke-width="5" stroke-dasharray="14 10"/>
    <text x="50" y="60" fill="#FFB224" font-size="28" font-weight="700">算力租金</text>
    <text x="900" y="285" fill="#E5484D" font-size="28" font-weight="700">利息不变</text>
    <text x="40" y="460" fill="#6E757C" font-size="18">示意，非真实数据</text>`, { left: '120px', top: '300px' });
  const pvT = el(R, '为什么像<span class="amber">光伏</span>？', { left: '120px', top: '200px', fontSize: '56px', fontWeight: 900 });
  const why = ['显卡谁都能买', '机房谁都能建', '供给追上需求 → 租金往下打', '新卡一出，旧卡降价'].map((x, i) => el(R, `<span class="pill" style="font-size:30px">${x}</span>`, { left: '1300px', top: `${320 + i * 100}px` }));
  const moat = el(R, '', { left: '120px', top: '220px', width: '1680px', height: '300px' });
  el(moat, '那门槛是什么？', { left: '0', top: '0', fontSize: '50px', fontWeight: 900 });
  const mc = ['电力', '规模', '交付速度', '大客户'].map((x, i) => card(moat, `<div style="font-size:52px;font-weight:900" class="amber">${x}</div>`, { left: `${i * 425}px`, top: '90px', width: '390px', textAlign: 'center' }));
  const ppl = el(R, '', { left: '120px', top: '560px', width: '1680px', height: '320px' });
  el(ppl, '这笔账，落在三类人头上', { left: '0', top: '0', fontSize: '44px', fontWeight: 900 });
  const pc = ['借钱给新云的人', '给新云担保的人', '最热的时候<br>追进去的人'].map((x, i) => card(ppl, `<div style="font-size:44px;font-weight:900;line-height:1.3" class="${i === 2 ? 'up' : ''}">${x}</div>`, { left: `${i * 570}px`, top: '70px', width: '540px', height: '200px' }));
  const big = el(R, '这期最想讲的：<br>这笔账，落在<span class="amber">谁</span>头上？', { left: '0', right: '0', top: '380px', textAlign: 'center', fontSize: '84px', fontWeight: 900, lineHeight: 1.3 });
  const tNv = c('先看英伟达'), tLu = c('上一期'), tD = c('那长期呢'), tPv = c('为什么像光伏'), tM = c('那他说的门槛'), tP = c('所以这笔账');
  return t => {
    H(t);
    show(big, t, s + 0.2, tNv - 0.2);
    show(loop, t, tNv, tLu - 0.3); draw(loop.querySelector('#l1'), t, c('卖显卡给它'), 0.8); draw(loop.querySelector('#l2'), t, c('挖矿的人再去'), 0.8);
    loop.querySelector('#l1').setAttribute('marker-end', t > c('卖显卡给它') + 0.7 ? 'url(#ah)' : ''); loop.querySelector('#l2').setAttribute('marker-end', t > c('挖矿的人再去') + 0.7 ? 'url(#ah)' : '');
    show(nv, t, tNv + 0.2, tLu - 0.3); show(nc, t, tNv + 0.5, tLu - 0.3);
    show(bs, t, c('它还承诺'), tLu - 0.3);
    show(ex, t, c('据美国财经'), tLu - 0.3); grow(e1, t, c('直接投资'), 'width', 9); grow(e2, t, c('直接投资') + 0.8, 'width', 400);
    show(e1t, t, c('直接投资') + 0.2); show(e2t, t, c('直接投资') + 1.0); show(eT, t, c('加起来'));
    show(lu, t, tLu, tD - 0.3); show(spin, t, c('这个圈往前'), tD - 0.3);
    show(dq, t, tD, tPv - 0.3); show(d0, t, tD + 0.2, c('短期有竞争力') - 0.1); show(d1, t, c('短期有竞争力')); show(d2, t, c('短期有竞争力') + 1.4); show(d3, t, c('很像光伏'));
    show(pvT, t, tPv, tM - 0.3); show(pv, t, c('显卡谁都能买'), tM - 0.3, 0.3, 0); draw(pv.querySelector('#rent'), t, c('一旦供给'), 1.6); draw(pv.querySelector('#int'), t, c('可借来的钱'), 0.8);
    why.forEach((w, i) => show(w, t, [c('显卡谁都能买'), c('显卡谁都能买') + 1.0, c('一旦供给'), c('而且显卡换代')][i], tM - 0.3));
    show(moat, t, tM); mc.forEach((e, i) => show(e, t, c('是电力') + i * 0.45));
    show(ppl, t, tP); pc.forEach((e, i) => show(e, t, c('借钱给新云') + [0, 1.0, 2.0][i]));
  };
};

// 6 多空总账
const SUM = (R, s, I) => {
  const c = n => cue(I, n);
  const H = head(R, s, '多空总账');
  const L = ['订单是真的：$1040亿', '需求是真的：巨头都在抢算力', '黄仁勋、高盛在站台'].map((x, i) => card(R, `<div style="font-size:36px;font-weight:700">${x}</div>`, { left: '120px', top: `${260 + i * 120}px`, width: '820px', padding: '20px 28px', borderLeft: '6px solid var(--up)' }));
  const Rr = ['钱是借的：债务 $356亿', '利息在涨：一年翻一倍多', '三到五年后：可能变成光伏'].map((x, i) => card(R, `<div style="font-size:36px;font-weight:700">${x}</div>`, { left: '980px', top: `${260 + i * 120}px`, width: '820px', padding: '20px 28px', borderLeft: '6px solid var(--blue)' }));
  const lh = el(R, '<span class="up">红方</span>', { left: '120px', top: '205px', fontSize: '32px', fontWeight: 900 });
  const rh = el(R, '<span class="blue">蓝方</span>', { left: '980px', top: '205px', fontSize: '32px', fontWeight: 900 });
  const q = el(R, '租金，能不能一直<span class="amber">跑赢利息</span>？', { left: '0', right: '0', top: '690px', textAlign: 'center', fontSize: '70px', fontWeight: 900 });
  return t => {
    H(t); const tr = c('红方说'), tb = c('蓝方说');
    const dim = (e, t0, i) => { show(e, t, s + 0.3 + i * 0.12); e.style.opacity = Math.min(+e.style.opacity, t > t0 ? 1 : 0.3); };
    dim(lh, tr, 0); L.forEach((e, i) => dim(e, tr + i * 0.9, i)); dim(rh, tb, 3); Rr.forEach((e, i) => dim(e, tb + i * 0.9, i + 3));
    show(q, t, c('租金，能不能'));
  };
};

// 7 三个开关
const SW = (R, s, I) => {
  const c = n => cue(I, n);
  const H = head(R, s, '接下来 · <span class="amber">三个开关</span>');
  const sw = [['10/27–28', '美联储议息', '利率往哪走', '第一'], ['这几周', '巨头财报', '明年算力开支还加不加', '第二'], ['11 月', 'CoreWeave 三季报', '市场找它要的利息能不能降', '第三']]
    .map(([d, n, w, nd], i) => [card(R, `<div class="mono amber" style="font-size:36px;font-weight:800">${d}</div><div style="font-size:42px;font-weight:900;margin-top:16px">${n}</div><div class="muted" style="font-size:30px;margin-top:14px;line-height:1.4">${w}</div>`, { left: `${120 + i * 570}px`, top: '280px', width: '540px', height: '360px' }), c(nd)]);
  return t => { H(t); sw.forEach(([e, t0], i) => { show(e, t, s + 0.3 + i * 0.3); e.style.opacity = Math.min(+e.style.opacity, t > t0 ? 1 : 0.45); e.style.borderColor = t > t0 ? 'var(--amber)' : 'var(--line)'; }); };
};

// 8 收尾：三个问题翻面成答案 → 二选一
const END = (R, s, I) => {
  const c = n => cue(I, n);
  const Q = [['订单这么多，<br>它为什么缺钱？', '订单<br>不是现金', '它缺钱'], ['大倒闭<br>会成真吗？', '会来，<br>先倒小的', '大倒闭会来'], ['这笔账<br>落在谁头上？', '借钱、担保、<br>追高的人', '这笔账，落在']];
  const cards = Q.map(([q], i) => card(R, `<div class="mono amber" style="font-size:36px;font-weight:800">0${i + 1}</div><div class="qq" style="font-size:50px;font-weight:900;line-height:1.3;margin-top:14px">${q}</div>`, { left: `${150 + i * 560}px`, top: '180px', width: '520px', height: '360px' }));
  const ask = el(R, '新云，是 AI 的<span class="amber">卖铲人</span>，还是<span class="up">背债人</span>？', { left: '0', right: '0', top: '610px', textAlign: 'center', fontSize: '58px', fontWeight: 900 });
  const chips = el(R, '<span class="pill" style="border-color:var(--amber);font-size:34px">评论区打「铲」</span>　　<span class="pill" style="border-color:var(--up);font-size:34px">评论区打「债」</span>', { left: '0', right: '0', top: '730px', textAlign: 'center' });
  const d = el(R, '本期只做行业信息整理，不提任何买卖建议，不构成任何投资建议', { left: '0', right: '0', top: '840px', textAlign: 'center', fontSize: '26px', color: 'var(--muted)' });
  return t => {
    cards.forEach((e, i) => {
      show(e, t, s + i * 0.25);
      const k = clamp((t - c(Q[i][2])) / 0.4);
      e.style.transform += ` rotateY(${k < 0.5 ? k * 180 : (1 - k) * 180}deg)`;
      const qq = e.querySelector('.qq'); const flip = k >= 0.5;
      if (flip !== !!e.dataset.flip) { qq.innerHTML = flip ? Q[i][1] : Q[i][0]; qq.style.color = flip ? 'var(--amber)' : ''; flip ? e.dataset.flip = 1 : delete e.dataset.flip; }
    });
    show(ask, t, c('所以你觉得')); show(chips, t, c('评论区打')); show(d, t, c('不构成'));
  };
};

BUILD.push(COLD, IDENT, KNIVES, MODEL, MUSK, WHO, SUM, SW, END);

// ---------- 主控 ----------
const sub = document.getElementById('sub'), chip = document.getElementById('chip');
window.setup = async tl => {
  TL = tl;
  const n = Math.max(...TL.lines.map(l => l.sec)) + 1;
  for (let i = 0; i < n; i++) {
    const R = el($s, '', {}, 'scene');
    SC.push({ R, title: TL.lines.find(l => l.sec === i).title.replace(/^\[[^\]]*\]\s*/, ''), up: BUILD[i] ? BUILD[i](R, secStart(i), i) : () => {} });
  }
  // 预载所有字形
  el(document.body, TL.lines.map(l => l.text).join(''), { opacity: 0, fontWeight: 700 });
  await document.fonts.ready;
  return n;
};
window.render = t => {
  SC.forEach((sc, i) => {
    const a = secStart(i) - 0.45, b = secEnd(i) - 0.45;
    const o = t < a || t > b + 0.4 ? 0 : Math.min(clamp((t - a) / 0.4), clamp((b + 0.4 - t) / 0.4));
    sc.R.style.opacity = o;
    if (o > 0) sc.up(t);
    if (t >= a && t < b) chip.textContent = sc.title;
  });
  const cur = TL.lines.find(l => l.text && t >= l.start - 0.05 && t < l.end + 0.25);
  sub.textContent = cur ? cur.text : '';
};
</script>
