<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>存储擂台 · 第三期 · 画面引擎</title>
<link rel="stylesheet" href="../out/node_modules/@fontsource/noto-sans-sc/400.css">
<link rel="stylesheet" href="../out/node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="../out/node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="../out/node_modules/@fontsource/jetbrains-mono/500.css">
<link rel="stylesheet" href="../out/node_modules/@fontsource/jetbrains-mono/800.css">
<style>
  /* 画风：扁平卡通擂台。浅色纸面，三个角落三种颜色，小存（绿色内存条）当解说；红涨绿跌 */
  :root {
    --paper: #F4EFE4; --mat: #EADFC8; --panel: #FFFFFF; --ink: #1F2430; --muted: #6B6F78; --line: #E2D8C4;
    --red: #E0464B; --blue: #3A63D6; --amber: #E39A12; --green: #23A563;
    --up: #E0464B; --down: #23A563;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
  body { font-family: 'Noto Sans SC', sans-serif; color: var(--ink); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 120%, #E7DCC4 0%, transparent 60%), var(--paper); }
  .abs { position: absolute; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .card { position: absolute; background: var(--panel); border: 3px solid var(--ink); border-radius: 18px; padding: 26px 32px; box-shadow: 8px 8px 0 rgba(31,36,48,.9); }
  .tag { font-size: 24px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
  .src { position: absolute; right: 18px; bottom: 10px; font-size: 16px; color: #8B8F98; font-family: 'JetBrains Mono', monospace; }
  .big { font-weight: 900; line-height: 1.05; }
  .up { color: var(--up); } .down { color: var(--down); } .red { color: var(--red); } .blue { color: var(--blue); } .amber { color: var(--amber); } .muted { color: var(--muted); } .green { color: var(--green); }
  .pill { display: inline-block; border: 3px solid var(--ink); border-radius: 999px; padding: 6px 20px; font-size: 26px; font-weight: 700; background: var(--panel); }
  .stamp { position: absolute; border: 6px solid var(--red); color: var(--red); border-radius: 12px; padding: 4px 18px; font-size: 40px; font-weight: 900; transform: rotate(-8deg); background: rgba(255,255,255,.85); }
  #top { position: absolute; left: 110px; right: 110px; top: 34px; height: 52px; display: flex; justify-content: space-between; align-items: center; font-size: 24px; }
  #top .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; }
  #top .brand b { background: var(--ink); color: var(--paper); padding: 4px 14px; border-radius: 8px; font-weight: 900; }
  #chip { border: 3px solid var(--ink); border-radius: 999px; padding: 3px 18px; font-weight: 700; background: var(--panel); }
  #score { position: absolute; right: 110px; top: 100px; display: flex; gap: 10px; opacity: 0; }
  #score span { border: 3px solid var(--ink); border-radius: 10px; padding: 2px 14px; font-size: 22px; font-weight: 900; background: var(--panel); color: var(--muted); }
  #score span.on { color: #fff; }
  #disclaimer { position: absolute; left: 30px; top: 150px; writing-mode: vertical-rl; font-size: 17px; color: rgba(107,111,120,.75); letter-spacing: .12em; }
  #sub { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); max-width: 1640px; padding: 8px 28px; border-radius: 12px;
    background: rgba(31,36,48,.9); color: #fff; font-size: 44px; font-weight: 700; text-align: center; white-space: nowrap; }
  #sub:empty { display: none; }
  .bar { position: absolute; border-radius: 8px; border: 3px solid var(--ink); }
  .plate { position: absolute; width: 230px; text-align: center; }
  .plate .nm { font-size: 34px; font-weight: 900; margin-top: 8px; }
  .plate .rl { font-size: 20px; color: var(--muted); font-weight: 700; }
  .say { position: absolute; background: var(--panel); border: 3px solid var(--ink); border-radius: 22px; padding: 18px 26px; font-size: 40px; font-weight: 900; line-height: 1.35; }
  .say::after { content: ''; position: absolute; left: 40px; bottom: -22px; border: 12px solid transparent; border-top: 14px solid var(--ink); }
  .hl { background: linear-gradient(transparent 58%, rgba(227,154,18,.45) 58%); }
</style>
</head>
<body>
<div id="stage">
  <div id="top"><div class="brand"><b>存储擂台</b>AI 是见顶了，还是中场休息？</div><div id="chip"></div></div>
  <div id="score"><span data-k="泡">泡沫派</span><span data-k="瓶">瓶颈派</span><span data-k="周">周期派</span></div>
  <div id="disclaimer">本视频仅为观点与信息整理，人物观点均为媒体转述，不构成投资建议</div>
  <div id="scenes"></div>
  <div id="sub"></div>
</div>
<script>
// ---------- 基础工具（同新云一期引擎） ----------
const $s = document.getElementById('scenes');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const pop = x => { const p = clamp(x); return p < 1 ? 1 - Math.pow(1 - p, 3) * Math.cos(p * 9) : 1; };
let TL = null, SC = [];
function el(parent, html, css = {}, cls = 'abs') { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; Object.assign(d.style, css); parent.appendChild(d); return d; }
function cue(sec, needle, k = 0) {
  const ls = TL.lines.filter(l => l.sec === sec && l.text.includes(needle));
  if (!ls.length) throw new Error(`找不到口播：第 ${sec} 段「${needle}」`);
  return ls[Math.min(k, ls.length - 1)].start;
}
function secStart(sec) { return TL.lines.find(l => l.sec === sec).start; }
function secEnd(sec) { const n = TL.lines.find(l => l.sec === sec + 1); return n ? n.start : TL.duration; }
function show(e, t, t0, t1 = Infinity, d = 0.4, dy = 26) {
  const p = ease((t - t0) / d), q = t1 === Infinity ? 1 : 1 - ease((t - t1) / 0.3);
  e.style.opacity = Math.min(p, q); e.style.transform = (e.dataset.base || '') + ` translateY(${(1 - p) * dy}px)`;
}
function bounce(e, t, t0, t1 = Infinity) { const p = pop((t - t0) / 0.5), q = t1 === Infinity ? 1 : 1 - ease((t - t1) / 0.3); e.style.opacity = Math.min(clamp((t - t0) / 0.15), q); e.style.transform = (e.dataset.base || '') + ` scale(${0.6 + 0.4 * p})`; }
function count(e, t, t0, to, fmt, d = 0.9) { e.textContent = fmt(to * ease((t - t0) / d)); }
function grow(e, t, t0, prop, to, d = 0.8) { e.style[prop] = (to * ease((t - t0) / d)) + 'px'; }
function svg(parent, w, h, inner, css) { return el(parent, `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`, css); }
function draw(path, t, t0, d = 0.6) { const L = path.getTotalLength(); path.style.strokeDasharray = L; path.style.strokeDashoffset = L * (1 - ease((t - t0) / d)); }
function card(parent, html, css) { return el(parent, html, css, 'card'); }
const dim = (e, on) => { e.style.filter = on ? 'none' : 'grayscale(1)'; e.style.opacity = Math.min(+e.style.opacity || 0, on ? 1 : 0.35); };

// ---------- 角色与道具 ----------
const C = { 泡: 'var(--red)', 瓶: 'var(--blue)', 周: 'var(--amber)' };
const CN = { 泡: '泡沫派', 瓶: '瓶颈派', 周: '周期派' };
// 小存：绿色内存条。mood: ok / ko（被打倒）/ point（指着）/ think
function xiaocun(mood = 'ok', s = 1) {
  const eyes = mood === 'ko'
    ? '<path d="M70 70 l22 22 M92 70 l-22 22 M150 70 l22 22 M172 70 l-22 22" stroke="#1F2430" stroke-width="8" stroke-linecap="round"/>'
    : '<circle cx="82" cy="80" r="13" fill="#1F2430"/><circle cx="160" cy="80" r="13" fill="#1F2430"/><circle cx="86" cy="75" r="4" fill="#fff"/><circle cx="164" cy="75" r="4" fill="#fff"/>';
  const mouth = mood === 'ko' ? '<path d="M100 122 q21 -16 42 0" fill="none" stroke="#1F2430" stroke-width="7" stroke-linecap="round"/>'
    : mood === 'think' ? '<path d="M104 120 h34" stroke="#1F2430" stroke-width="7" stroke-linecap="round"/>'
    : '<path d="M98 112 q23 22 46 0" fill="none" stroke="#1F2430" stroke-width="7" stroke-linecap="round"/>';
  const arm = mood === 'point' ? '<path d="M236 120 L300 70" stroke="#1F2430" stroke-width="12" stroke-linecap="round"/><circle cx="304" cy="66" r="12" fill="#23A563" stroke="#1F2430" stroke-width="5"/>' : '';
  const chips = [0, 1, 2, 3].map(i => `<rect x="${22 + i * 52}" y="140" width="38" height="34" rx="4" fill="#1F2430"/>`).join('');
  const pins = Array.from({ length: 11 }, (_, i) => `<rect x="${18 + i * 19}" y="196" width="12" height="22" rx="2" fill="#E3B341" stroke="#1F2430" stroke-width="3"/>`).join('');
  return `<svg width="${320 * s}" height="${230 * s}" viewBox="0 0 320 230"><rect x="6" y="20" width="230" height="182" rx="18" fill="#23A563" stroke="#1F2430" stroke-width="7"/>${chips}${pins}${eyes}${mouth}${arm}<rect x="108" y="196" width="22" height="24" fill="#F4EFE4"/></svg>`;
}
// 名牌剪影：不画真人脸
function plate(parent, name, role, color, css) {
  return el(parent, `<svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="70" fill="${color}" stroke="#1F2430" stroke-width="6"/><circle cx="75" cy="58" r="26" fill="#1F2430"/><path d="M28 128 q47 -58 94 0" fill="#1F2430"/></svg><div class="nm">${name}</div><div class="rl">${role}</div>`, css, 'plate');
}
// 角落徽章
function badge(k, size = 120) {
  const icon = k === '泡' ? '<circle cx="48" cy="58" r="22" fill="none" stroke="#fff" stroke-width="7"/><circle cx="78" cy="38" r="12" fill="none" stroke="#fff" stroke-width="6"/><circle cx="80" cy="76" r="8" fill="none" stroke="#fff" stroke-width="5"/>'
    : k === '瓶' ? '<path d="M32 22 h56 M32 98 h56 M38 22 q0 30 22 38 q-22 8 -22 38 M82 22 q0 30 -22 38 q22 8 22 38" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>'
    : '<path d="M14 62 q16 -40 32 0 t32 0 t32 0" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>';
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120"><rect x="4" y="4" width="112" height="112" rx="22" fill="${C[k]}" stroke="#1F2430" stroke-width="7"/>${icon}</svg>`;
}
// 擂台（透视）
function ring(parent, css, lit = {}) {
  const post = (x, y, k) => `<rect x="${x - 14}" y="${y - 150}" width="28" height="160" rx="6" fill="${k ? C[k] : '#B9AE97'}" stroke="#1F2430" stroke-width="5" class="post" data-k="${k || ''}"/>`;
  return svg(parent, 1400, 560, `
    <polygon points="200,180 1200,180 1360,520 40,520" fill="#EADFC8" stroke="#1F2430" stroke-width="6"/>
    <polygon points="40,520 1360,520 1360,552 40,552" fill="#CFC2A6" stroke="#1F2430" stroke-width="6"/>
    ${[0, 1, 2].map(i => `<path d="M${200 - i * 6} ${110 + i * 28} L${1200 + i * 6} ${110 + i * 28}" stroke="#E0464B" stroke-width="7"/><path d="M${40 + i * 8} ${360 + i * 40} L${200 - i * 6} ${110 + i * 28}" stroke="#1F2430" stroke-width="6"/><path d="M${1360 - i * 8} ${360 + i * 40} L${1200 + i * 6} ${110 + i * 28}" stroke="#1F2430" stroke-width="6"/>`).join('')}
    ${post(200, 180, '泡')}${post(1200, 180, '瓶')}${post(40, 520, '周')}${post(1360, 520, '')}`, css);
}
const head = (R, s, k, txt) => {
  const h = el(R, `<span style="display:inline-block;vertical-align:middle;margin-right:18px">${badge(k, 76)}</span><span style="vertical-align:middle">${txt}</span>`, { left: '110px', top: '120px', fontSize: '48px', fontWeight: 900 });
  return t => show(h, t, s);
};
const quote = (parent, who, txt, src, color, css) => card(parent, `<div class="tag" style="color:${color}">${who}</div><div style="font-size:46px;font-weight:900;line-height:1.4;margin-top:10px">${txt}</div>${src ? `<div class="src">${src}</div>` : ''}`, Object.assign({ borderLeft: `14px solid ${color}` }, css));

// ================= 第三期：每段一个场景 =================
const BUILD = [];

// 0 冷开场：首帧 = 封面
BUILD.push((R, s) => {
  const c = n => cue(0, n);
  const ko = el(R, xiaocun('ko', 1.25), { left: '1180px', top: '560px', dataBase: '' });
  ko.dataset.base = 'rotate(-14deg)';
  const stars = svg(R, 300, 120, [0, 1, 2].map(i => `<path transform="translate(${40 + i * 90} ${30 + (i % 2) * 30})" d="M0 -20 L6 -6 L21 -6 L9 3 L13 18 L0 9 L-13 18 L-9 3 L-21 -6 L-6 -6Z" fill="#E39A12" stroke="#1F2430" stroke-width="4"/>`).join(''), { left: '1260px', top: '470px' });
  const cover = el(R, '<div class="tag" style="font-size:30px">10 月 30 日 · 黑色星期五</div><div style="font-size:84px;font-weight:900;margin-top:8px">芯片股一天</div><div class="big mono down" style="font-size:200px">−1 万亿</div><div style="font-size:84px;font-weight:900">美元</div>', { left: '110px', top: '200px' });
  const intel = card(R, '<div class="tag">英特尔 · 10/30 单日</div><div class="big mono down" style="font-size:130px">−28%</div><div class="muted" style="font-size:24px;font-weight:700">1974 年以来最差</div>', { left: '1150px', top: '170px', width: '520px' });
  const goog = card(R, '<div class="tag">两天前 · 谷歌</div><div style="font-size:52px;font-weight:900;margin-top:6px">史上最大<br>单日跌幅</div>', { left: '1150px', top: '170px', width: '520px' });
  const v1 = el(R, '泡沫破了，<span class="red">快跑！</span>', { left: '200px', top: '300px', fontSize: '60px' }, 'say');
  const v2 = el(R, '产能卖到 2030，<span class="blue">别慌！</span>', { left: '980px', top: '300px', fontSize: '60px' }, 'say');
  const x1 = el(R, '这期两种都不讲', { left: '640px', top: '520px' }, 'stamp');
  const names = ['李录', '马克斯', '达利欧', '段永平', '德鲁肯米勒'].map((n, i) => plate(R, n, '据报道 / 整理稿', ['#F1B9B6', '#F1B9B6', '#F1B9B6', '#F5D7A0', '#B9C8F2'][i], { left: `${150 + i * 330}px`, top: '230px' }));
  const boss = el(R, '+ 一群产业里的老板', { left: '0', right: '0', top: '560px', textAlign: 'center', fontSize: '48px', fontWeight: 900 });
  const three = ['泡', '瓶', '周'].map((k, i) => card(R, `<div style="display:flex;align-items:center;gap:22px">${badge(k, 110)}<div><div style="font-size:60px;font-weight:900;color:${C[k]}">${CN[k]}</div><div class="muted" style="font-size:26px;font-weight:700">${['技术是真的，泡沫也是真的', '最聪明的钱没有撤，在挑', '暴利会自己消灭自己'][i]}</div></div></div>`, { left: `${110 + i * 580}px`, top: '300px', width: '540px', padding: '24px 26px' }));
  const hint = el(R, '最反常识的一句，在 6 分钟左右', { left: '110px', top: '600px', fontSize: '30px', fontWeight: 700, color: 'var(--muted)' });
  const note = el(R, '<span class="pill" style="font-size:24px">下面的人物观点，都来自媒体报道和整理稿</span>', { left: '110px', top: '700px' });
  const tI = c('英特尔一天'), tG = c('两天前'), tV = c('两种声音'), tX = c('这期两种'), tN = c('我把最近'), t3 = c('他们其实'), tNote = c('先说明');
  return t => {
    show(cover, t, s - 1, tV - 0.2, 0.01, 0); show(ko, t, s - 1, tV - 0.2, 0.01, 0); show(stars, t, s - 1, tV - 0.2, 0.01, 0);
    stars.style.transform += ` rotate(${(t - s) * 40}deg)`; stars.style.transformOrigin = '50% 50%';
    show(intel, t, tI, tG - 0.15); show(goog, t, tG, tV - 0.2);
    bounce(v1, t, tV + 0.6, tN - 0.2); bounce(v2, t, tV + 1.6, tN - 0.2); bounce(x1, t, tX, tN - 0.2);
    names.forEach((p, i) => show(p, t, tN + i * 0.25, t3 - 0.2)); show(boss, t, c('一群产业'), t3 - 0.2);
    three.forEach((e, i) => show(e, t, t3 + 0.6 + i * 0.35)); show(hint, t, t3 + 1.8); show(note, t, tNote);
  };
});

// 1 先把问题问对
BUILD.push((R, s) => {
  const c = n => cue(1, n);
  const H = el(R, '「AI 见顶了吗」= <span class="amber">三个问题</span>', { left: '110px', top: '120px', fontSize: '50px', fontWeight: 900 });
  const Q = ['AI 有没有用？', '谁来付账？钱从哪来？', '暴利：是周期，还是结构？'].map((q, i) => card(R, `<span class="mono amber" style="font-size:40px;font-weight:800;margin-right:18px">0${i + 1}</span><span style="font-size:50px;font-weight:900">${q}</span>`, { left: '110px', top: `${230 + i * 150}px`, width: '1000px', padding: '22px 30px' }));
  const strike = el(R, '', { left: '190px', top: '282px', height: '8px', width: '0', background: 'var(--red)', borderRadius: '4px' });
  const nobody = el(R, '几乎没人吵了', { left: '760px', top: '232px', fontSize: '34px' }, 'stamp');
  const rows = [['谷歌', '明年多花', '−13%', 'down'], ['Meta', '明年多花', '−7%', 'down'], ['亚马逊', '明年多花', '−6%', 'down'], ['微软', '花得少', '涨', 'up'], ['甲骨文', '说出哪年不再烧钱', '+12%', 'up']];
  const tbl = card(R, `<div class="tag">财报后股价（据报道）</div>` + rows.map(([n, a, v, cl]) => `<div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed var(--line);padding:10px 0"><span style="font-size:36px;font-weight:900;width:150px">${n}</span><span class="muted" style="font-size:28px;font-weight:700;flex:1">${a}</span><span class="mono ${cl}" style="font-size:44px;font-weight:800">${v}</span></div>`).join(''), { left: '1160px', top: '230px', width: '650px' });
  const ruler = el(R, '<div class="tag" style="font-size:30px">市场的尺子变了</div><div style="font-size:52px;font-weight:900;margin-top:8px"><span class="muted" style="text-decoration:line-through;text-decoration-thickness:5px">花了多少</span>　→　<span class="hl">花完还剩多少现金</span></div>', { left: '110px', top: '760px' });
  const zhu = quote(R, '朱啸虎 · 9 月（据报道）', '今年只要强调加大资本开支的公司，<br>股价都跌', '腾讯新闻 · 9/19', 'var(--muted)', { left: '110px', top: '680px', width: '1700px' });
  const veil = el(R, '', { left: '0', top: '0', width: '1920px', height: '1080px', background: 'rgba(244,239,228,.96)' });
  const big = el(R, '<div class="tag" style="font-size:34px">对存储和芯片最要命的</div><div style="font-size:110px;font-weight:900;margin-top:10px">暴利，是<span class="amber">周期</span>，还是<span class="blue">结构</span>？</div>', { left: '0', right: '0', top: '330px', textAlign: 'center' });
  const tQ2 = c('第二个'), tZ = c('朱啸虎'), tQ3 = c('第三个问题');
  return t => {
    show(H, t, s);
    Q.forEach((q, i) => show(q, t, [s + 0.4, c('第一个'), tQ2][i] - (i ? 0 : 0)));
    grow(strike, t, c('几乎没人'), 'width', 420, 0.4); bounce(nobody, t, c('几乎没人') + 0.3, tQ2);
    Q[0].style.opacity = Math.min(+Q[0].style.opacity, t > tQ2 ? 0.35 : 1); strike.style.opacity = t > tQ2 ? 0.35 : 1;
    show(tbl, t, c('这一周'), tQ3 - 0.2);
    show(ruler, t, c('市场的尺子'), tZ - 0.2); show(zhu, t, tZ, tQ3 - 0.2);
    show(veil, t, tQ3, Infinity, 0.3, 0); show(big, t, tQ3 + 0.1, Infinity, 0.4, 30);
  };
});

// 2 泡沫派
BUILD.push((R, s) => {
  const c = n => cue(2, n);
  const H = head(R, s, '泡', '第一派 · <span class="red">泡沫派</span>：技术是真的，泡沫也是真的');
  const P = [['李录', '喜马拉雅资本'], ['马克斯', '橡树资本'], ['达利欧', '桥水创始人'], ['哈特尼特', '美银首席策略师']].map(([n, r], i) => plate(R, n, r, '#F1B9B6', { left: `${110 + i * 250}px`, top: '230px', width: '220px' }));
  const P2 = P.map(p => p.cloneNode(true));
  // 李录：一次性投入 vs 每次都烧

// 5 钱在怎么投票
BUILD.push((R, s) => {

  const retail = card(R, '<div class="tag">另一边</div><div style="font-size:40px;font-weight:900;margin-top:8px">散户在买 · 空头仓位<br><span class="red">五年来最高</span></div>', { left: '1160px', top: '600px', width: '650px' });
  const veil = el(R, '', { left: '0', top: '0', width: '1920px', height: '1080px', background: 'rgba(244,239,228,.96)' });
  const end = el(R, '<div style="font-size:84px;font-weight:900">该卖的人，<br>卖了<span class="hl">一大半</span>，还<span class="red">没卖完</span></div>', { left: '0', right: '0', top: '340px', textAlign: 'center' });
  const tE = c('该卖的人');
  return t => {
    show(H, t, s); show(axis, t, s + 0.3, Infinity, 0.3, 0);
    show(q, t, c('量化团队')); show(e1, t, c('两天后')); show(e2, t, c('三天后') > 0 ? c('两天后') + 0.9 : 0);
    show(w, t, c('威尔逊')); show(gs, t, c('高盛')); show(retail, t, c('散户'));
    show(veil, t, tE, Infinity, 0.3, 0); show(end, t, tE + 0.1);

});

// 6 我们的判断
BUILD.push((R, s) => {
  const c = n => cue(6, n);

    .map(([n, x, k], i) => [card(R, `<div style="display:flex;gap:28px;align-items:flex-start"><span class="mono amber" style="font-size:40px;font-weight:800;white-space:nowrap">${n}</span><span style="font-size:40px;font-weight:900;line-height:1.4">${x}</span></div>`, { left: '110px', top: `${240 + i * 200}px`, width: '1700px', padding: '22px 30px' }), c(k)]);

  return t => { show(top, t, s); J.forEach(([e, t0]) => show(e, t, t0)); show(ask, t, c('所以与其')); };

// 7 跟踪清单
BUILD.push((R, s) => {
  const c = n => cue(7, n);
  const H = el(R, '跟踪清单 · <span class="amber">每一条都对应一位聪明人的框架</span>', { left: '110px', top: '120px', fontSize: '48px', fontWeight: 900 });
  const L = [['瓶', '台积电扩产计划', '扩得越猛，越要小心', '贝克的温度计', '第一'], ['泡', '云巨头现金流转正时间表', '能不能给出年份', '达利欧和马克斯的尺子', '第二'], ['周', '每月 1 号韩国芯片出口 · 月底 DRAM 合约价', '涨价减速到零附近就是信号', '周期派的信号', '第三'], ['', '11 月中旬', '量化派和威尔逊，谁说对了', '钱的投票', '第四']]
    .map(([k, a, b, w, n], i) => [card(R, `<div style="display:flex;gap:22px;align-items:center">${k ? badge(k, 84) : `<div style="width:84px;height:84px;border-radius:18px;border:6px solid #1F2430;display:grid;place-items:center;font-size:44px;font-weight:900">$</div>`}<div style="flex:1"><div style="font-size:36px;font-weight:900">${a}</div><div class="muted" style="font-size:26px;font-weight:700;margin-top:4px">${b}</div></div><span class="pill" style="font-size:22px">${w}</span></div>`, { left: `${110 + (i % 2) * 870}px`, top: `${220 + Math.floor(i / 2) * 230}px`, width: '830px', padding: '22px 26px' }), c(n)]);

  return t => {

BUILD.push((R, s) => {

// ---------- 主控 ----------
const sub = document.getElementById('sub'), chip = document.getElementById('chip'), score = document.getElementById('score');
const SCORE = { 2: '泡', 3: '瓶', 4: '周' };
window.setup = async tl => {
  TL = tl;
  const n = Math.max(...TL.lines.map(l => l.sec)) + 1;
  for (let i = 0; i < n; i++) {
    const R = el($s, '', {}, 'scene');
    SC.push({ R, title: TL.lines.find(l => l.sec === i).title.replace(/^\[[^\]]*\]\s*/, '').split('：')[0], up: BUILD[i] ? BUILD[i](R, secStart(i), i) : () => {} });
  }
  el(document.body, TL.lines.map(l => l.text).join(''), { opacity: 0, fontWeight: 900 });
  await document.fonts.ready;
  return n;
};
window.render = t => {
  SC.forEach((sc, i) => {
    const a = secStart(i) - 0.45, b = secEnd(i) - 0.45;
    const o = t < a || t > b + 0.4 ? 0 : Math.min(i === 0 ? 1 : clamp((t - a) / 0.4), clamp((b + 0.4 - t) / 0.4));
    sc.R.style.opacity = o;
    if (o > 0) sc.up(t);
    if (t >= a && t < b) chip.textContent = sc.title;
  });
  // 三派计分条：进入三派以后常驻，当前一派点亮
  const cur = SC.findIndex((_, i) => t >= secStart(i) - 0.45 && t < secEnd(i) - 0.45);
  score.style.opacity = cur >= 2 && cur <= 7 ? 1 : 0;
  score.querySelectorAll('span').forEach(e => { const on = SCORE[cur] === e.dataset.k || (cur > 4 && cur < 8); e.className = on ? 'on' : ''; e.style.background = on ? C[e.dataset.k] : 'var(--panel)'; });
  const line = TL.lines.find(l => l.text && t >= l.start - 0.05 && t < l.end + 0.25);
  sub.textContent = line ? line.text : '';
};
</script>
