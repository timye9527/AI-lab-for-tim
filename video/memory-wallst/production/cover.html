<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>存储复盘 · 封面</title>
<link rel="stylesheet" href="../out/node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="../out/node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="../out/node_modules/@fontsource/jetbrains-mono/800.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0B0D10; color: #EDEEF0; font-family: 'Noto Sans SC', sans-serif; overflow: hidden; }
  .c { position: relative; overflow: hidden;
    background: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px) 0 0 / 60px 60px,
                linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px) 0 0 / 60px 60px,
                radial-gradient(ellipse at 70% 30%, rgba(48,164,108,.18), transparent 60%), #0B0D10; }
  .mono { font-family: 'JetBrains Mono', monospace; font-weight: 800; }
  .down { color: #30A46C; } .amber { color: #FFB224; }
  .k { position: absolute; background: #FFB224; border-radius: 8px; transform: rotate(32deg); }
  .tagline { position: absolute; color: #9BA1A6; font-weight: 700; }
</style>
</head>
<body>
<div id="c" class="c"></div>
<script>
// 三种比例：16:9（B 站 / 西瓜 / YouTube）、3:4（小红书 / 视频号）、9:16（抖音）
const V = { wide: [1920, 1080], card: [1080, 1440], tall: [1080, 1920] };
const v = new URLSearchParams(location.search).get('v') || 'wide';
const [W, H] = V[v]; const c = document.getElementById('c');
c.style.width = W + 'px'; c.style.height = H + 'px'; document.body.style.width = W + 'px';
const S = W / 1920 * (v === 'wide' ? 1 : 1.75);
const add = (html, css) => { const d = document.createElement('div'); d.style.position = 'absolute'; d.innerHTML = html; Object.assign(d.style, css); c.appendChild(d); return d; };
if (v === 'wide') {
  add('5 天蒸发', { left: '100px', top: '110px', fontSize: '90px', fontWeight: 900 });
  add('<span class="mono amber">7000亿</span><span style="font-size:90px;font-weight:900">美元</span>', { left: '90px', top: '210px', fontSize: '220px', lineHeight: 1 });
  add('是长鑫打趴了三星？', { left: '100px', top: '500px', fontSize: '110px', fontWeight: 900 });
  add('<span class="mono down">−26%</span>', { right: '110px', top: '620px', fontSize: '170px' });
  add('海力士 · 一周', { right: '120px', top: '820px', fontSize: '44px', fontWeight: 700, color: '#9BA1A6' });
  add('', { left: '100px', top: '690px', width: '760px', height: '8px', background: '#FFB224' });
  add('存储复盘 · 一周五刀', { left: '100px', top: '730px', fontSize: '52px', fontWeight: 700, color: '#9BA1A6' });
  [[1460, 120], [1600, 160], [1740, 120]].forEach(([x, y]) => add('', { left: x + 'px', top: y + 'px', width: '22px', height: '240px', background: '#FFB224', borderRadius: '8px', transform: 'rotate(28deg)' }));
} else {
  const top = v === 'tall' ? 360 : 120;
  add('5 天蒸发', { left: '80px', top: top + 'px', fontSize: '96px', fontWeight: 900 });
  add('<span class="mono amber">7000亿</span>', { left: '70px', top: (top + 120) + 'px', fontSize: '230px', lineHeight: 1 });
  add('美元', { left: '80px', top: (top + 360) + 'px', fontSize: '96px', fontWeight: 900 });
  add('是长鑫<br>打趴了三星？', { left: '80px', top: (top + 520) + 'px', fontSize: '120px', fontWeight: 900, lineHeight: 1.15 });
  add('<span class="mono down">−26%</span>', { left: '80px', top: (top + 860) + 'px', fontSize: '150px' });
  add('海力士 · 一周', { left: '90px', top: (top + 1030) + 'px', fontSize: '44px', fontWeight: 700, color: '#9BA1A6' });
  [[700, top + 880], [820, top + 920], [940, top + 880]].forEach(([x, y]) => add('', { left: x + 'px', top: y + 'px', width: '22px', height: '220px', background: '#FFB224', borderRadius: '8px', transform: 'rotate(28deg)' }));
  add('存储复盘 · 一周五刀', { left: '84px', top: (H - 130) + 'px', fontSize: '44px', fontWeight: 700, color: '#9BA1A6' });
}
</script>
</body>
</html>
