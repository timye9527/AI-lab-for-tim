<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>存储复盘 · 画面引擎</title>
<link rel="stylesheet" href="../out/node_modules/@fontsource/noto-sans-sc/400.css">
<link rel="stylesheet" href="../out/node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="../out/node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="../out/node_modules/@fontsource/jetbrains-mono/500.css">
<link rel="stylesheet" href="../out/node_modules/@fontsource/jetbrains-mono/800.css">
<style>
  :root {
    --bg: #0B0D10; --panel: #14171C; --line: #262B33; --text: #EDEEF0; --muted: #9BA1A6;
    --up: #E5484D; --down: #30A46C; --blue: #3E63DD; --amber: #FFB224;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Noto Sans SC', sans-serif; color: var(--text); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.035), transparent 60%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 80px 80px,
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 80px 80px,
      var(--bg); }
  .abs { position: absolute; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .card { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 34px; }
  .tag { font-size: 24px; color: var(--muted); letter-spacing: .02em; }
  .src { position: absolute; right: 18px; bottom: 12px; font-size: 17px; color: #6E757C; font-family: 'JetBrains Mono', monospace; }
  .big { font-weight: 900; line-height: 1.05; }
  .up { color: var(--up); } .down { color: var(--down); } .blue { color: var(--blue); } .amber { color: var(--amber); } .muted { color: var(--muted); }
  .quote { font-size: 44px; font-weight: 700; line-height: 1.45; }
  .who { font-size: 26px; color: var(--muted); margin-bottom: 18px; }
  .cred { display: flex; gap: 22px; margin-top: 22px; font-size: 20px; color: var(--muted); }
  .cred b { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-left: 4px; background: #3A3F47; vertical-align: -1px; }
  .cred b.on { background: var(--text); } .cred b.warn { background: var(--amber); } .cred b.bad { background: var(--up); }
  #chrome-top { position: absolute; left: 120px; right: 120px; top: 40px; height: 40px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; color: var(--muted); }
  #chrome-top .brand b { color: var(--amber); font-weight: 700; margin-right: 12px; }
  #chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 18px; color: var(--text); }
  #disclaimer { position: absolute; left: 34px; top: 140px; writing-mode: vertical-rl; font-size: 17px; color: rgba(155,161,166,.6); letter-spacing: .12em; }
  #sub { position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%); max-width: 1600px; padding: 10px 28px; border-radius: 10px;
    background: rgba(0,0,0,.55); font-size: 46px; font-weight: 700; text-align: center; white-space: nowrap; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #sub:empty { display: none; }
  .bar { position: absolute; border-radius: 6px; }
  .pill { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 6px 18px; font-size: 24px; }
  table.t4 { position: absolute; border-collapse: collapse; font-size: 28px; }
  table.t4 td { border-bottom: 1px solid var(--line); padding: 18px 20px; vertical-align: top; }
  table.t4 td:first-child { color: var(--muted); width: 170px; font-size: 24px; padding-top: 22px; }
</style>
</head>
<body>
<div id="stage">
  <div id="chrome-top"><div class="brand"><b>看懂AI主线</b>存储一周复盘 · 2026.10.12 – 10.16</div><div id="chip"></div></div>
  <div id="disclaimer">本视频仅为行业信息整理，不构成投资建议 · 过往表现不代表未来</div>
  <div id="scenes"></div>
  <div id="sub"></div>
</div>
<script>
// ---------- 基础工具 ----------
const $s = document.getElementById('scenes');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
let TL = null, SC = [], cues = [];

function el(parent, html, css = {}, cls = 'abs') {
  const d = document.createElement('div');
  d.className = cls; d.innerHTML = html; Object.assign(d.style, css); parent.appendChild(d); return d;
}
// 按口播关键词找时间点（改稿后依然对得上）
function cue(sec, needle, k = 0) {
  const ls = TL.lines.filter(l => l.sec === sec && l.text.includes(needle));
  if (!ls.length) throw new Error(`找不到口播：第 ${sec} 段「${needle}」`);
  return ls[Math.min(k, ls.length - 1)].start;
}
function secStart(sec) { return TL.lines.find(l => l.sec === sec).start; }
function secEnd(sec) { const n = TL.lines.find(l => l.sec === sec + 1); return n ? n.start : TL.duration; }
// 动画：淡入上浮 / 淡出
function show(e, t, t0, t1 = Infinity, d = 0.45, dy = 24) {
  const p = ease((t - t0) / d), q = t1 === Infinity ? 1 : 1 - ease((t - t1) / 0.35);
  const o = Math.min(p, q);
  e.style.opacity = o; e.style.transform = (e.dataset.base || '') + ` translateY(${(1 - p) * dy}px)`;
}
function count(e, t, t0, to, fmt, d = 0.9) { e.textContent = fmt(to * ease((t - t0) / d)); }
function grow(e, t, t0, prop, to, d = 0.8) { e.style[prop] = (to * ease((t - t0) / d)) + 'px'; }
function svg(parent, w, h, inner, css) { return el(parent, `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`, css); }
function draw(path, t, t0, d = 0.6) { const L = path.getTotalLength(); path.style.strokeDasharray = L; path.style.strokeDashoffset = L * (1 - ease((t - t0) / d)); }
function card(parent, html, css) { return el(parent, html, css, 'card'); }
function quoteCard(parent, who, text, cred, src, css) {
  const c = ['信息位置', '真金白银', '利益相关'].map((n, i) => `<span>${n}${cred[i]}</span>`).join('');
  return card(parent, `<div class="who">${who}</div><div class="quote">${text}</div><div class="cred">${c}</div><div class="src">${src}</div>`, css);
}
const dots = (n, cls = 'on') => Array.from({ length: 3 }, (_, i) => `<b class="${i < n ? cls : ''}"></b>`).join('');

// ---------- 场景定义：每段口播一个场景 ----------
const BUILD = [];

// 0 冷开场
BUILD[0] = (R, s) => {
  const date = el(R, '<span class="mono amber">2026.10.10</span> · 上海', { left: '120px', top: '150px', fontSize: '34px' });
  const q = el(R, '长鑫存储总裁：首款 4F² 内存，年底前推出', { left: '120px', top: '205px', fontSize: '40px', fontWeight: 700 });
  const names = [['SK 海力士', 26, 'CNBC · 10/15'], ['三星电子', 22, ''], ['美光', 11, '']];
  const nums = names.map(([n, v], i) => {
    const box = el(R, `<div class="tag">${n} · 5 个交易日</div><div class="big mono down" style="font-size:${i < 2 ? 150 : 110}px">−0%</div>`, { left: `${120 + i * 560}px`, top: '330px' });
    return [box, box.lastChild, v];
  });
  const total = el(R, '<div class="tag">全球存储板块市值蒸发</div><div class="big mono amber" style="font-size:120px">$0</div><div class="src" style="position:static;margin-top:6px">CNBC / Benzinga · 10/15</div>', { left: '120px', top: '560px' });
  const days = ['一 10/12', '二 10/13', '三 10/14', '四 10/15', '五 10/16'].map((d, i) =>
    el(R, `<div class="tag">${d}</div><div class="mono" style="font-size:44px;font-weight:800;margin-top:6px">—</div>`,
      { left: `${120 + i * 340}px`, top: '330px', width: '300px', height: '200px', border: '1px solid var(--line)', borderRadius: '12px', padding: '24px', background: 'var(--panel)' }));
  const ask = el(R, '?', { left: '0', right: '0', top: '560px', textAlign: 'center', fontSize: '220px', fontWeight: 900, color: 'var(--amber)' });
  const t1 = cue(0, '五个交易日'), t2 = cue(0, '蒸发'), t3 = cue(0, '周一只让'), t4 = cue(0, '周二和周四'), t5 = cue(0, '到底发生');
  return t => {
    show(date, t, s); show(q, t, s + 0.4, t3);
    nums.forEach(([b, n, v], i) => { show(b, t, t1 + i * 0.35, t3); count(n, t, t1 + i * 0.35, v, x => `−${Math.round(x)}%`); });
    show(total, t, t2, t3); count(total.children[1], t, t2, 7000, x => `$${Math.round(x)}亿+`, 1.4);
    days.forEach((d, i) => {
      show(d, t, t3 + i * 0.08);
      if (i === 0 && t > t3 + 0.3) { d.lastChild.textContent = '−3.4%'; d.lastChild.className = 'mono down'; }
      if ((i === 1 || i === 3) && t > t4) {
        d.lastChild.textContent = '两位数'; d.lastChild.className = 'down'; d.lastChild.style.fontWeight = 900;
        d.style.borderColor = Math.floor((t - t4) * 3) % 2 && t < t4 + 1.6 ? 'transparent' : 'var(--amber)'; d.style.borderWidth = '3px';
      }
    });
    show(ask, t, t5, Infinity, 0.3, 0);
  };
};

// 1 上涨账本
BUILD[1] = (R, s) => {
  const axis = svg(R, 1680, 120, '<line x1="0" y1="60" x2="1680" y2="60" stroke="#3A3F47" stroke-width="3"/>', { left: '120px', top: '130px' });
  const ms = [['9/9', '高盛：最坏的时候可能已过去', '9 月 9 号'], ['9 月', '美光 +17% · 海力士 +16%', '接下来一个月'], ['9/30', '美光单季收入 $542亿', '9 月 30 号'], ['10/5', '美光市值 $1.2万亿', '10 月 5 号'], ['10/8', '三星单季营业利润 107万亿韩元', '10 月 8 号，三星']]
    .map(([d, txt, nd], i) => [el(R, `<div class="mono amber" style="font-size:26px">${d}</div><div style="font-size:24px;margin-top:6px;width:320px">${txt}</div>`, { left: `${120 + i * 345}px`, top: '160px' }), cue(1, nd)]);
  const P = [['订单', '2027–28 更紧', '更关键的是'], ['价格', '合约价仍在涨', '据报道，三星'], ['利润', '107万亿韩元', '10 月 8 号，三星'], ['长约', '美光 26 份 · 锁定 75%+\n三星约 80% · 海力士 5 年', '美光签了 26 份']];
  const pil = P.map(([n, sub, nd], i) => {
    const x = 260 + i * 380;
    const b = el(R, '', { left: `${x}px`, bottom: '330px', width: '220px', height: '0px', background: 'linear-gradient(180deg, rgba(229,72,77,.9), rgba(229,72,77,.35))', borderRadius: '8px 8px 0 0' });
    const lab = el(R, `<div style="font-size:36px;font-weight:900">${n}</div><div class="muted" style="font-size:20px;white-space:pre-line">${sub}</div>`, { left: `${x}px`, top: '762px', width: '340px' });
    return [b, lab, cue(1, nd)];
  });
  const full = cue(1, '四根柱子'), crack = cue(1, '第一道裂缝');
  // 柱子出现前，中间用大数字卡撑住画面
  const hero = [
    ['<div style="font-size:88px;font-weight:900">倒回一个月</div><div class="muted" style="font-size:40px;margin-top:10px">七月暴跌之后，存储股一直在找底</div>', '先倒回', '9 月 9 号'],
    ['<div class="tag">高盛 · 9/9 对客户</div><div style="font-size:64px;font-weight:900;margin-top:12px">「最坏的时候，可能已经过去了」</div>', '9 月 9 号', '接下来一个月'],
    ['<div class="tag">一个月涨幅</div><div style="margin-top:8px"><span style="font-size:40px;font-weight:700">美光 </span><span class="mono up" style="font-size:130px;font-weight:800">+17%</span><span style="font-size:40px;font-weight:700;margin-left:60px">海力士 </span><span class="mono up" style="font-size:130px;font-weight:800">+16%</span></div>', '接下来一个月', '9 月 30 号'],
    ['<div class="tag">美光 FQ4 · 9/30</div><div style="margin-top:8px"><span style="font-size:40px;font-weight:700">单季收入 </span><span class="mono amber" style="font-size:150px;font-weight:800">$542亿</span></div><div style="font-size:40px;font-weight:700">2027、2028 年 <span class="up">比今年更紧</span></div>', '9 月 30 号', '更关键的是'],
  ].map(([h, a, b]) => [el(R, h, { left: '120px', top: '400px', width: '1680px' }), cue(1, a), cue(1, b)]);
  const crk = svg(R, 1560, 420, '<path d="M0 210 L210 170 L330 250 L520 150 L700 260 L880 160 L1060 240 L1240 140 L1400 230 L1560 190" fill="none" stroke="#FFB224" stroke-width="7"/>', { left: '180px', top: '330px' });
  const crLab = el(R, '10/8 · 第一道裂缝', { right: '140px', top: '300px', fontSize: '34px', fontWeight: 900, color: 'var(--amber)' });
  return t => {
    show(axis, t, s, Infinity, 0.4, 0);
    ms.forEach(([e, t0]) => show(e, t, t0));
    hero.forEach(([e, a, b]) => show(e, t, a + 0.2, b - 0.35));
    pil.forEach(([b, lab, t0]) => { grow(b, t, t0, 'height', 340); show(lab, t, t0); b.style.boxShadow = t > full ? '0 0 40px rgba(229,72,77,.45)' : 'none'; });
    show(crk, t, crack, Infinity, 0.2, 0); draw(crk.querySelector('path'), t, crack, 0.7); show(crLab, t, crack + 0.4);
  };
};

// 2 一周五刀
BUILD[2] = (R, s) => {
  const dates = [8, 9, 10, 11, 12, 13, 14, 15, 16];
  const X = d => 160 + (d - 8) * 200;
  const axis = svg(R, 1920, 140, `<line x1="140" y1="70" x2="1780" y2="70" stroke="#3A3F47" stroke-width="3"/>` +
    dates.map(d => `<text x="${X(d)}" y="40" fill="#9BA1A6" font-size="22" font-family="JetBrains Mono" text-anchor="middle">10/${d}</text>`).join(''), { left: '0', top: '110px' });
  const K = [[8, '第一刀', 'OpenAI 收入'], [10, '第二刀', '长鑫 4F²'], [12, '第三刀', '陈福阳：缺钱'], [13, '第四刀', '马斯克 + 2029'], [15, '第五刀', '加息 · 熔断']];
  const knives = K.map(([d, n, lab]) => {
    const g = svg(R, 80, 80, `<path d="M15 8 L65 72" stroke="#FFB224" stroke-width="9" stroke-linecap="round"/>`, { left: `${X(d) - 40}px`, top: '168px' });
    const odd = [12, 13].indexOf(d) === 1;
    const l = el(R, `<span class="amber" style="font-weight:900">${n}</span><br>${lab}`, { left: `${X(d) - 90}px`, top: odd ? '292px' : '252px', fontSize: '22px', width: '180px', textAlign: 'center', lineHeight: '1.3' });
    return [g, l, cue(2, n)];
  });
  const kt = K.map(k => cue(2, k[1])).concat([secEnd(2)]);
  const P = { top: '320px' };
  // 刀 1：OpenAI
  const k1 = el(R, '', { left: '120px', top: '370px', width: '1680px', height: '500px' });
  const lab1 = el(k1, '<div class="tag">OpenAI 9 月底年化收入（美元）</div>', { left: '0', top: '0' });
  const b70 = el(k1, '', { left: '0', top: '80px', height: '90px', width: '0', background: '#3A3F47' }, 'bar');
  const t70 = el(k1, '市场流传 <span class="mono">~$700亿</span>', { left: '20px', top: '100px', fontSize: '32px', fontWeight: 700 });
  const b50 = el(k1, '', { left: '0', top: '210px', height: '90px', width: '0', background: 'var(--up)' }, 'bar');
  const t50 = el(k1, 'OpenAI 告诉投资人 <span class="mono">~$500亿</span>', { left: '20px', top: '230px', fontSize: '32px', fontWeight: 700 });
  const gap = el(k1, '<span class="mono amber" style="font-size:64px;font-weight:800">−$200亿</span>', { left: '1060px', top: '205px' });
  const ask1 = el(k1, 'AI 公司的收入，撑得起算力订单吗？', { left: '0', top: '360px', fontSize: '58px', fontWeight: 900 });
  el(k1, 'FT · 10/8；彭博称 OpenAI 仍预计年底达 $700亿+', { right: '0', bottom: '0', fontSize: '18px', color: '#6E757C' });
  // 刀 2：4F²
  const k2 = el(R, '', { left: '120px', top: '370px', width: '1680px', height: '500px' });
  const cell = (n, cols, size, color) => Array.from({ length: n }, (_, i) => `<rect x="${(i % cols) * size}" y="${Math.floor(i / cols) * size * 1}" width="${size - 4}" height="${size - 4}" rx="3" fill="${color}"/>`).join('');
  const g6 = svg(k2, 420, 420, cell(36, 6, 70, '#3A3F47'), { left: '80px', top: '50px' });
  const g4 = svg(k2, 420, 420, Array.from({ length: 54 }, (_, i) => `<rect x="${(i % 9) * 46.66}" y="${Math.floor(i / 9) * 70}" width="${42}" height="${66}" rx="3" fill="#FFB224"/>`).join(''), { left: '640px', top: '50px' });
  const l6 = el(k2, '<b>6F²</b> · 现在主流', { left: '80px', top: '0', fontSize: '30px' });
  const l4 = el(k2, '<b class="amber">4F²</b> · 单元面积 −1/3（理论）', { left: '640px', top: '0', fontSize: '30px' });
  const n4 = el(k2, '<div class="tag">长鑫 · 首款 4F² 产品</div><div style="font-size:40px;font-weight:900;margin-top:8px">服务器 DDR5 RDIMM</div><div class="amber" style="font-size:32px;font-weight:700">年底前推出</div><div class="tag" style="margin-top:14px">未公布速度 / 容量 / 良率</div>', { left: '1190px', top: '40px', width: '490px' });
  const ss = el(k2, '<div class="tag">三星 4F² 量产目标（据报道）</div><div class="mono" style="font-size:56px;font-weight:800">2028</div>', { left: '1190px', top: '290px' });
  const mon = el(k2, '<div class="tag">10/12 周一收盘</div><div style="font-size:34px;font-weight:700">海力士 <span class="mono down">−3.4%</span>　三星 <span class="mono down">−3.6%</span></div>', { left: '1190px', top: '420px' });
  // 刀 3：陈福阳
  const k3 = el(R, '', { left: '120px', top: '370px', width: '1680px', height: '500px' });
  const q3 = quoteCard(k3, '陈福阳 Hock Tan · 博通 CEO · 10/12 新加坡', 'AI 扩张最大的瓶颈，可能不是芯片、内存或电力，<span class="amber">而是资本。</span>', [dots(3), dots(3), dots(1, 'warn')], '路透 · 10/12', { left: '0', top: '0', width: '1680px' });
  const q3b = el(k3, '「今天的内存短缺，一年后可能就不是这样了。」', { left: '0', top: '330px', fontSize: '40px', fontWeight: 700 });
  const sh = el(k3, '卖铲子的人说：<span class="amber">挖矿的人快没钱了</span>', { left: '0', top: '430px', fontSize: '50px', fontWeight: 900 });
  // 刀 4：马斯克 + 2029
  const k4 = el(R, '', { left: '120px', top: '370px', width: '1680px', height: '500px' });
  const q4 = quoteCard(k4, '马斯克 · X · 10/13（中文译文，回复摩根大通存储报告）', '美光给了合理的远期报价，其他供应商要价<span class="amber">高得离谱</span>。现有客户不会忘记这一点。', [dots(2), dots(1), dots(1, 'bad')], 'Seoul Economic Daily · 10/14', { left: '0', top: '0', width: '1060px' });
  const q4b = el(k4, '「中国 2028 年会造大量内存。」', { left: '0', top: '360px', fontSize: '36px', fontWeight: 700 });
  const stamp = el(k4, '10/13 海力士<br>单日两位数下跌', { left: '1160px', top: '20px', fontSize: '40px', fontWeight: 900, color: 'var(--down)', border: '4px solid var(--down)', borderRadius: '10px', padding: '14px 24px', transform: 'rotate(-6deg)' });
  const news = card(k4, '<div class="tag">《每日经济》专栏（据报道）</div><div style="font-size:30px;font-weight:700;margin-top:8px">新产能可能在 <span class="amber mono">2029</span> 年造成过剩</div>', { left: '1100px', top: '200px', width: '580px', background: '#1B1A16', borderColor: '#3B3626' });

  const a = el(R, '长鑫是<span class="amber">导火索</span>，不是炸药', { left: '0', right: '0', top: '230px', textAlign: 'center', fontSize: '64px', fontWeight: 900 });
  const b = el(R, '炸药：<span class="amber">谁来付钱？</span>', { left: '0', right: '0', top: '360px', textAlign: 'center', fontSize: '96px', fontWeight: 900 });
  const c = el(R, '<span class="pill" style="border-color:var(--up);font-size:34px">红 · 错杀</span>　　<span class="pill" style="border-color:var(--blue);font-size:34px">蓝 · 周期顶点的第一枪</span>', { left: '0', right: '0', top: '560px', textAlign: 'center' });
  const d = el(R, '本期只做行业信息整理，不构成任何投资建议', { left: '0', right: '0', top: '700px', textAlign: 'center', fontSize: '28px', color: 'var(--muted)' });
  return t => { show(a, t, s); show(b, t, cue(7, '炸药是')); show(c, t, cue(7, '错杀')); show(d, t, cue(7, '不构成')); };
};


// ================= v3：冷开场 / 片头 / 五刀快剪 =================
const COLD3 = (R, s) => {
  const top = el(R, '<div class="tag">全球存储板块 · 一周</div><div class="big mono amber" style="font-size:190px;transform-origin:0 50%">−$7000亿</div>', { left: '120px', top: '150px' });
  const nums = [['SK 海力士', 26], ['三星电子', 22]].map(([n, v], i) => {
    const b = el(R, `<div class="tag">${n}</div><div class="big mono down" style="font-size:130px">−0%</div>`, { left: `${120 + i * 520}px`, top: '430px' });
    return [b, v];
  });
  const claim = el(R, '<div class="tag">所有人都说</div><div style="font-size:64px;font-weight:900;margin-top:6px"><span id="c3a">长鑫一个 4F²，把韩国人打趴了</span></div>', { left: '120px', top: '660px' });
  const mon = el(R, '<div class="tag">可同一条消息 · 周一</div><div class="mono down" style="font-size:96px;font-weight:800">−3%</div>', { left: '1240px', top: '430px', border: '3px solid var(--amber)', borderRadius: '14px', padding: '18px 30px' });
  const pain = el(R, '拿着存储的，<span class="amber">先看完再下结论</span>', { left: '0', right: '0', top: '480px', textAlign: 'center', fontSize: '76px', fontWeight: 900 });
  const qs = ['长鑫到底<br>有多可怕？', 'AI 的钱<br>还够不够？', '存储的周期<br>消失了吗？'].map((q, i) =>
    card(R, `<div class="mono amber" style="font-size:40px;font-weight:800">0${i + 1}</div><div style="font-size:56px;font-weight:900;line-height:1.25;margin-top:14px">${q}</div>`, { left: `${150 + i * 560}px`, top: '300px', width: '500px', height: '400px' }));
  const qh = el(R, '这期只回答三个问题', { left: '150px', top: '190px', fontSize: '44px', fontWeight: 700, color: 'var(--muted)' });
  const t1 = cue(0, '海力士跌了'), t2 = cue(0, '所有人都说'), t3 = cue(0, '周一只让'), t4 = cue(0, '先看完'), t5 = cue(0, '三个问题'), t6 = cue(0, '长鑫到底');
  const L6 = TL.lines.find(l => l.sec === 0 && l.text.includes('长鑫到底')); const d6 = L6.end - L6.start;
  return t => {
    top.style.opacity = t < t4 - 0.2 ? 1 : 1 - clamp((t - t4 + 0.2) / 0.3); top.lastChild.style.transform = `scale(${1.15 - 0.15 * ease((t - s + 0.6) / 0.4)})`;
    nums.forEach(([b, v], i) => { show(b, t, t1 + i * 0.3, t4 - 0.2); count(b.lastChild, t, t1 + i * 0.3, v, x => `−${Math.round(x)}%`, 0.7); });
    show(claim, t, t2, t4 - 0.2);
    const c3 = claim.querySelector('#c3a'); c3.style.textDecoration = t > t3 + 0.4 ? 'line-through' : 'none'; c3.style.textDecorationColor = 'var(--amber)'; c3.style.textDecorationThickness = '6px'; c3.style.color = t > t3 + 0.4 ? 'var(--muted)' : 'var(--text)';
    show(mon, t, t3, t4 - 0.2, 0.25, 0);
    show(pain, t, t4, t5 - 0.15, 0.3, 0);
    show(qh, t, t5);
    qs.forEach((q, i) => show(q, t, t6 + i * d6 / 3, Infinity, 0.35, 40));
  };
};

// 5 秒栏目片头：晶圆 → 芯片 → HBM 逐层翻起 → 栏目名
const IDENT = (R, s) => {
  R.style.background = 'radial-gradient(ellipse at 50% 45%, #15202B 0%, #0B0D10 70%)';
  const dies = Array.from({ length: 13 }, (_, r) => Array.from({ length: 13 }, (_, c) => {
    const x = (c - 6) * 34, y = (r - 6) * 34; return Math.hypot(x + 17, y + 17) < 210 ? `<rect x="${x + 230}" y="${y + 230}" width="30" height="30" rx="3" fill="#2A3442"/>` : '';
  }).join('')).join('');
  const wafer = svg(R, 460, 460, `<circle cx="230" cy="230" r="222" fill="#1B2430" stroke="#5B6B80" stroke-width="3"/>${dies}<circle cx="230" cy="230" r="222" fill="url(#sh)"/><defs><linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`, { left: '730px', top: '250px' });
  const stage3d = el(R, '', { left: '760px', top: '260px', width: '400px', height: '420px', perspective: '900px' });
  const layers = Array.from({ length: 12 }, (_, i) => el(stage3d, '', { left: '60px', top: `${330 - i * 22}px`, width: '280px', height: '18px', borderRadius: '4px',
    background: i === 0 ? 'linear-gradient(90deg,#8C6A1C,#FFB224)' : 'linear-gradient(90deg,#3E4D61,#8FA3BC)', boxShadow: '0 2px 0 rgba(0,0,0,.5)', transformOrigin: '50% 100%' }));
  const name = el(R, '看懂AI主线', { left: '0', right: '0', top: '700px', textAlign: 'center', fontSize: '110px', fontWeight: 900, letterSpacing: '.06em' });
  const slogan = el(R, '<span class="amber">AI × 存储</span>　·　每周洞见', { left: '0', right: '0', top: '850px', textAlign: 'center', fontSize: '40px', fontWeight: 700, color: 'var(--muted)' });
  const bar = el(R, '', { left: '760px', top: '835px', width: '400px', height: '6px', background: 'var(--amber)', transformOrigin: '50% 50%' });
  return t => {
    const k = t - s;
    const w1 = clamp(k / 0.9);
    wafer.style.opacity = Math.min(w1, 1 - clamp((k - 1.6) / 0.4));
    wafer.style.transform = `scale(${0.6 + 0.4 * ease(w1)}) rotate(${k * 70}deg)`;
    layers.forEach((L, i) => {
      const p = ease((k - 1.6 - i * 0.12) / 0.35);
      L.style.opacity = clamp((k - 1.6 - i * 0.12) / 0.1);
      L.style.transform = `rotateX(${(1 - p) * 88}deg) translateY(${(1 - p) * -30}px)`;
    });
    stage3d.style.transform = `translateY(${-60 * ease((k - 3.4) / 0.6)}px) scale(${1 - 0.15 * ease((k - 3.4) / 0.6)})`;
    name.style.opacity = clamp((k - 3.3) / 0.25); name.style.transform = `scale(${1.25 - 0.25 * ease((k - 3.3) / 0.35)})`;
    bar.style.transform = `scaleX(${ease((k - 3.5) / 0.4)})`; slogan.style.opacity = clamp((k - 3.7) / 0.3);
  };
};

// 五刀快剪：一条时间轴，每刀一张卡；结尾「只有一刀是长鑫，另外四刀：钱」
const KNIVES3 = (R, s) => {
  const dates = [8, 9, 10, 11, 12, 13, 14, 15];
  const X = d => 200 + (d - 8) * 215;
  el(R, '先用一分钟，过一遍这一周', { left: '120px', top: '110px', fontSize: '34px', fontWeight: 700, color: 'var(--muted)' });
  svg(R, 1920, 90, `<line x1="160" y1="60" x2="1760" y2="60" stroke="#3A3F47" stroke-width="3"/>` + dates.map(d => `<text x="${X(d)}" y="40" fill="#9BA1A6" font-size="24" font-family="JetBrains Mono" text-anchor="middle">10/${d}</text>`).join(''), { left: '0', top: '160px' });
  const K = [[8, '第一刀', '钱', 'FT：OpenAI 年化收入约 <span class="mono">$500亿</span>，比市场传的少近 <span class="mono amber">$200亿</span>'],
             [10, '第二刀', '长鑫', '长鑫：<span class="amber">4F²</span> 服务器内存，年底前推出'],
             [12, '第三刀', '钱', '博通 CEO 陈福阳：AI 最大的瓶颈，可能是<span class="amber">资本</span>'],
             [13, '第四刀', '钱', '马斯克：其他供应商要价<span class="amber">高得离谱</span>，客户不会忘记<br><span class="muted" style="font-size:30px">同一周 · 韩国专栏：过剩可能在 2029 年（据报道）</span>'],
             [15, '第五刀', '钱', '美国通胀超预期 · 加息押注升温 · <span class="down">KOSPI 熔断</span>']];
  const ks = K.map(([d, n, kind, txt], i) => {
    const g = svg(R, 80, 90, `<path d="M15 8 L65 82" stroke="#FFB224" stroke-width="10" stroke-linecap="round"/>`, { left: `${X(d) - 40}px`, top: '178px' });
    const lab = el(R, `<span class="mono" style="font-weight:800">${n}</span>`, { left: `${X(d) - 60}px`, top: '275px', width: '120px', textAlign: 'center', fontSize: '24px', color: 'var(--amber)' });
    const c = el(R, `<div class="mono amber" style="font-size:30px;font-weight:800">${n} · 10/${d}</div><div style="font-size:52px;font-weight:900;line-height:1.35;margin-top:14px">${txt}</div>`, { left: '160px', top: '400px', width: '1600px' });
    return { g, lab, c, kind, t0: cue(2, n) };
  });
  const sum = el(R, '五刀里，只有<span class="muted">一刀</span>是长鑫', { left: '160px', top: '420px', fontSize: '72px', fontWeight: 900 });
  const money = el(R, '另外四刀，砍的都是同一个地方：<span class="amber" style="font-size:140px">钱</span>', { left: '160px', top: '560px', fontSize: '60px', fontWeight: 900 });
  const tS = cue(2, '你发现没有'), tM = cue(2, '另外四刀');
  return t => {
    ks.forEach((k, i) => {
      const next = i + 1 < ks.length ? ks[i + 1].t0 : tS;
      show(k.g, t, k.t0, Infinity, 0.12, 0); draw(k.g.querySelector('path'), t, k.t0, 0.2); show(k.lab, t, k.t0 + 0.1);
      show(k.c, t, k.t0 + 0.1, next - 0.25, 0.3, 30);
      const dim = t > tS && k.kind === '长鑫'; k.g.querySelector('path').setAttribute('stroke', dim ? '#4A4F57' : '#FFB224'); k.lab.style.color = dim ? '#6E757C' : 'var(--amber)';
      k.g.style.filter = t > tM && k.kind === '钱' ? 'drop-shadow(0 0 12px rgba(255,178,36,.9))' : 'none';
    });
    show(sum, t, tS); show(money, t, tM);
  };
};

// 6 多空总账（v3 新增，待样片确认后细化）
const SUMMARY = (R, s) => {
  const a = el(R, '多空总账', { left: '120px', top: '130px', fontSize: '52px', fontWeight: 900 });
  const q = el(R, '谁来为这场 AI 军备竞赛付钱？', { left: '0', right: '0', top: '450px', textAlign: 'center', fontSize: '72px', fontWeight: 900, color: 'var(--amber)' });
  return t => { show(a, t, s); show(q, t, cue(6, '两边吵到最后')); };
};

// v3 段落顺序：0 冷开场 / 1 片头 / 2 五刀 / 3 长鑫 / 4 钱 / 5 周期 / 6 总账 / 7 开关 / 8 收尾
// 3、4、5、7、8 沿用 v2 场景，关键词待样片确认后按 v3 口播改
const OLD = BUILD.slice();
BUILD.length = 0;
BUILD.push(COLD3, IDENT, KNIVES3, OLD[3], OLD[5], OLD[4], SUMMARY, OLD[6], OLD[7]);

// ---------- 主控 ----------
const sub = document.getElementById('sub'), chip = document.getElementById('chip');
window.setup = async tl => {
  TL = tl;
  const n = Math.max(...TL.lines.map(l => l.sec)) + 1;
  for (let i = 0; i < n; i++) {
    const R = el($s, '', {}, 'scene');
    SC.push({ R, title: TL.lines.find(l => l.sec === i).title.replace(/^\[[^\]]*\]\s*/, ''), up: BUILD[i] ? BUILD[i](R, secStart(i)) : () => {} });
  }
  // 预载所有字形
  el(document.body, TL.lines.map(l => l.text).join(''), { opacity: 0, fontWeight: 700 });
  await document.fonts.ready;
  return n;
};
window.render = t => {
  SC.forEach((sc, i) => {
    const a = secStart(i) - 0.45, b = secEnd(i) - 0.45;
    const o = t < a || t > b + 0.4 ? 0 : Math.min(clamp((t - a) / 0.4), clamp((b + 0.4 - t) / 0.4));
    sc.R.style.opacity = o;
    if (o > 0) sc.up(t);
    if (t >= a && t < b) chip.textContent = sc.title;
  });
  const cur = TL.lines.find(l => l.text && t >= l.start - 0.05 && t < l.end + 0.25);
  sub.textContent = cur ? cur.text : '';
};
</script>
